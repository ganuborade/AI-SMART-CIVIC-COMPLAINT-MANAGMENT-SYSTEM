# ==========================================================
# AI SMART CIVIC COMPLAINT MANAGEMENT SYSTEM CONFIGURATION
# ==========================================================

spring.application.name=civic-complaint-system
server.port=${SERVER_PORT:8080}

# Database Connection (Resolved from .env or fallback)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/civic_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8&rewriteBatchedStatements=true&cachePrepStmts=true&prepStmtCacheSize=250&prepStmtCacheSqlLimit=2048&useServerPrepStmts=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:Roor@123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP High-Performance Connection Pool
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.pool-name=CivicMySQLHikariPool

# JPA / Hibernate Configuration for MySQL
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=true
spring.jpa.properties.hibernate.jdbc.batch_size=25
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Multipart & File Upload Settings
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=25MB
file.upload-dir=${FILE_UPLOAD_DIR:./uploads}

# JWT Security
jwt.secret=${JWT_SECRET:civic-smart-ai-complaint-system-jwt-secret-key-2026-secure-token}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Role Registration Passkeys
app.admin.secret-key=${ADMIN_REGISTRATION_KEY:ADMIN@2026}
app.employee.secret-key=${EMPLOYEE_REGISTRATION_KEY:STAFF@2026}

# AI Engine Configuration
gemini.api.key=${GEMINI_API_KEY:}
