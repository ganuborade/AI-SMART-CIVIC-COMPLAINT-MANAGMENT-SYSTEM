# ==========================================================
# AI SMART CIVIC COMPLAINT MANAGEMENT SYSTEM CONFIGURATION
# ==========================================================

spring.application.name=civic-complaint-system
server.port=${SERVER_PORT:8080}

# Database Connection (Resolved from .env or fallback)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/civic_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=true

# Multipart & File Upload Settings
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=25MB
file.upload-dir=${FILE_UPLOAD_DIR:./uploads}

# JWT Security
jwt.secret=${JWT_SECRET:civic-smart-ai-complaint-system-jwt-secret-key-2026-secure-token}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# AI Engine Configuration
gemini.api.key=${GEMINI_API_KEY:}
